spring.application.name=membership-module-test

# Datasource URL/username/password are supplied dynamically per test run by
# AbstractPostgresIntegrationTest's @DynamicPropertySource, pointed at a real ephemeral Postgres
# container (Testcontainers) - not H2. See docs/hld/README.md ADR-001 addendum.
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

membership.checkout.delivery-fee=49.00
membership.subscription.grace-period-days=3
