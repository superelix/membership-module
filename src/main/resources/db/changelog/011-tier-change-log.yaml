databaseChangeLog:
  - changeSet:
      id: 011-tier-change-log
      author: membership-module
      comment: "docs/prd/07-data-model.md §3 TierChangeLog - append-only, insert-only audit trail (MP-NFR-07)."
      changes:
        - createTable:
            tableName: tier_change_log
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: member_id, type: uuid, constraints: { nullable: false } }
              - column: { name: from_tier_id, type: uuid }
              - column: { name: to_tier_id, type: uuid, constraints: { nullable: false } }
              - column: { name: reason, type: varchar(255), constraints: { nullable: false } }
              - column: { name: triggered_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: occurred_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: tier_change_log
            baseColumnNames: member_id
            referencedTableName: member
            referencedColumnNames: id
            constraintName: fk_tier_change_log_member
        - addForeignKeyConstraint:
            baseTableName: tier_change_log
            baseColumnNames: from_tier_id
            referencedTableName: tier
            referencedColumnNames: id
            constraintName: fk_tier_change_log_from_tier
        - addForeignKeyConstraint:
            baseTableName: tier_change_log
            baseColumnNames: to_tier_id
            referencedTableName: tier
            referencedColumnNames: id
            constraintName: fk_tier_change_log_to_tier
        - createIndex:
            indexName: ix_tier_change_log_member_id
            tableName: tier_change_log
            columns:
              - column: { name: member_id }
              - column: { name: occurred_at }
