databaseChangeLog:
  - changeSet:
      id: 005-tier-criterion
      author: membership-module
      comment: "docs/prd/07-data-model.md §3 TierCriterion - type is a plain string (ADR-006), not a DB enum/check, so the registry stays open for extension."
      changes:
        - createTable:
            tableName: tier_criterion
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: criteria_set_id, type: uuid, constraints: { nullable: false } }
              - column: { name: type, type: varchar(255), constraints: { nullable: false } }
              - column: { name: params_json, type: TEXT, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: tier_criterion
            baseColumnNames: criteria_set_id
            referencedTableName: tier_criteria_set
            referencedColumnNames: tier_id
            constraintName: fk_tier_criterion_criteria_set
            onDelete: CASCADE
        - createIndex:
            indexName: ix_tier_criterion_criteria_set_id
            tableName: tier_criterion
            columns:
              - column: { name: criteria_set_id }
