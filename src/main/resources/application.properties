spring.application.name=membership-module

# Postgres, run locally via `docker compose up -d` (see docker-compose.yml at project root).
# Superseded H2 file-mode per docs/hld/README.md ADR-001 addendum.
spring.datasource.url=jdbc:postgresql://localhost:5432/membership
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=membership
spring.datasource.password=membership

# Liquibase owns the schema now; Hibernate only verifies its mappings match, never generates DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

membership.checkout.delivery-fee=49.00
membership.subscription.grace-period-days=3
# How often PendingPlanChangeScheduler checks for due pending plan changes to apply.
membership.subscription.plan-change-check-interval-ms=60000
